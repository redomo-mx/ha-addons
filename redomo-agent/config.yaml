name: Agente Redomo
version: "0.2.23"
slug: redomo_agent
description: >-
  Ejecuta las automatizaciones de Redomo desde esta casa, sin depender de que
  nadie tenga la app abierta.
url: https://github.com/redomo-mx/ha-addons/tree/main/redomo-agent
image: ghcr.io/redomo-mx/redomo-agent-{arch}

arch:
  - amd64
  - aarch64

# El complemento pide acceso a Home Assistant y el Supervisor le entrega una
# credencial propia al arrancar. Por eso la configuración de abajo NO incluye
# ningún token: no hay que crearlo, ni guardarlo en el equipo, ni rotarlo, ni se
# puede filtrar.
homeassistant_api: true

# Se reinicia solo si se cae, y arranca con Home Assistant. Las automatizaciones
# de una casa no pueden depender de que alguien se acuerde de encenderlo.
startup: application
boot: auto
init: false

# La clave `anon` viene puesta, y eso es correcto: es PUBLICA por diseno.
#
# Va dentro de la app que cualquiera descarga al abrir app.redomo.mx, asi que
# ponerla aqui no la expone mas de lo que ya esta. Lo que protege los datos no es
# esta clave, es que cada consulta pasa por las politicas de la base: con ella
# sola, sin haber entrado, no se puede leer ni escribir nada de ninguna casa.
#
# Se pone para quitar un paso de la instalacion. Pegarla a mano en cada casa no
# daba ninguna seguridad y si daba una forma de equivocarse -- y equivocarse ahi
# significa un agente que no arranca en casa de un cliente, con el instalador ya
# de salida.
options:
  supabase_url: "https://boycrbjiqijuxujkvydy.supabase.co"
  supabase_anon_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJveWNyYmppcWlqdXh1amt2eWR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTQwOTQsImV4cCI6MjEwMTY5MDA5NH0.obtOkFs0xIrPChJLIOknMvZssxbSaKkwpphyclquhxU"
  agent_email: ""
  agent_password: ""
  tick_seconds: 15
  tunnel_token: ""

schema:
  supabase_url: url
  supabase_anon_key: str
  agent_email: str
  agent_password: password
  tick_seconds: int(5,300)
  # El tunel de soporte, opcional. Se saca del panel de Cloudflare Zero Trust al
  # crear un tunel para esta casa, y sirve para entrar a dar soporte sin abrir
  # ningun puerto del router del cliente.
  #
  # Vacio = esta casa no tiene tunel. Es un estado valido: las automatizaciones
  # y la app funcionan igual, solo que no se puede entrar desde fuera.
  #
  # Quien tenga este texto puede levantar el tunel de esta casa desde cualquier
  # parte del mundo. Por eso va como `password`: no se ve en pantalla y no sale
  # en el registro.
  tunnel_token: password?
